name: Bullseye Auto Trader
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install --upgrade pip ccxt yfinance "pandas==2.0.3" numpy "pandas-ta==0.3.14b" xgboost scikit-learn tensorflow textblob requests beautifulsoup4

      - name: Run Bullseye
        run: python ml_trader_lstm.py

      - name: Save wallet to GitHub
        run: |
          git config --global user.email "bullseye@bot.com"
          git config --global user.name "Bullseye Bot"
          git add ml_wallet.json ml_trade_log.csv || true
          git diff --staged --quiet || git commit -m "Auto trade $(date +'%Y-%m-%d %H:%M')"
          git push || true